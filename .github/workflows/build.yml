name: Heer Music Android checks

on:
  push:
    branches: [main, feature/heer-music]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heer-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate and build test APK
        run: |
          chmod +x gradlew
          ./gradlew ktlintCheck :app:assembleFossDebug :app:testFossDebugUnitTest --no-daemon --max-workers=2
      - name: Validate release notes
        run: python3 .github/scripts/nightly_notes.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: Heer-Music-debug
          path: app/build/outputs/apk/foss/debug/*.apk
